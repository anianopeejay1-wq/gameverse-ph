<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#00ff88"><title>Memory Match | GAMEVERSE PH</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090914;color:#fff;font:16px Arial,sans-serif;min-height:100vh;padding:20px}
header,.wrap{max-width:760px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
a,.btn{background:#00ef88;color:#06130c;border:0;border-radius:9px;padding:10px 15px;font-weight:800;text-decoration:none;cursor:pointer}
h1{color:#00ef88;margin:8px 0}.panel{background:#17172a;border:1px solid #30304a;border-radius:16px;padding:20px;margin:14px 0;text-align:center}
button{font:inherit}.muted{color:#aaa}.score{font-size:20px;color:#00ef88;font-weight:800;margin:12px}
.grid{display:grid;gap:8px;justify-content:center;margin:16px auto}.cell{background:#292943;border:1px solid #454566;border-radius:8px;display:grid;place-items:center;min-width:48px;min-height:48px;font-size:22px;font-weight:800;color:white;cursor:pointer}
input{padding:10px;border-radius:8px;border:0;max-width:100%}
@media(max-width:500px){body{padding:12px}.panel{padding:14px}.cell{min-width:42px;min-height:42px}}
</style></head><body><header><b style="color:#00ef88;font-size:22px">GAMEVERSE PH</b><a href="../index.html">← Game Lobby</a></header><main class="wrap"><section class="panel"><h1>Memory Match</h1><p class="muted">Play for fun • Earn practice points</p><div class="score" id="status">Find all matching pairs</div><div id="board" class="grid" style="grid-template-columns:repeat(4,64px)"></div><button class="btn" onclick="init()">Restart</button><p>Moves: <b id="moves">0</b> • Practice points: <b id="points">0</b></p></section></main><script>
function award(points){let total=Number(localStorage.getItem('gv_points')||0)+points;localStorage.setItem('gv_points',total);let el=document.getElementById('points');if(el)el.textContent=total;}
const icons=['🍉','🚀','🐼','⭐','🎮','🍀','⚽','🔥'];let cards,first,lock,moves,matched;function init(){cards=[...icons,...icons].sort(()=>Math.random()-.5);first=null;lock=false;moves=0;matched=0;document.getElementById('moves').textContent=0;render()}function render(){let el=document.getElementById('board');el.innerHTML='';cards.forEach((v,i)=>{let b=document.createElement('button');b.className='cell';b.style.height='64px';b.textContent=matched.includes(i)||first===i? v:'?';b.onclick=()=>flip(i);el.appendChild(b)})}function flip(i){if(lock||matched.includes(i)||first===i)return;if(first===null){first=i;render();return}moves++;document.getElementById('moves').textContent=moves;if(cards[first]===cards[i]){matched.push(first,i);first=null;if(matched.length===16){document.getElementById('status').textContent='You matched them all!';award(10)}}else{let prev=first;first=i;lock=true;render();setTimeout(()=>{first=null;lock=false;render()},700);return}render()}init();
</script></body></html>
